:root{--bg:#07090c;--panel:rgba(14,18,24,.82);--panel2:rgba(22,28,38,.9);--line:rgba(120,160,210,.18);--blue:#18a0ff;--blue2:#66d0ff;--text:#e8eef6;--dim:#8da0b6;--warn:#ffb020;--bad:#ff4467;--good:#34e29a;--gold:#ffcf40;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--text);user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.hidden{display:none!important}
.h1{font-weight:800;font-style:italic;letter-spacing:.06em;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:10px;background:linear-gradient(180deg,rgba(40,52,70,.95),rgba(24,32,44,.95));border:1px solid var(--line);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;transition:transform .12s,background .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-1px);border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset,0 6px 22px rgba(24,160,255,.25)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.pri{background:linear-gradient(180deg,#27b1ff,#0b78d6);border-color:#58c4ff;color:#fff;box-shadow:0 6px 24px rgba(24,160,255,.35)}
.btn.pri:hover{background:linear-gradient(180deg,#4cc0ff,#1a8ae8)}
.btn.bad{background:linear-gradient(180deg,#d6405d,#9b1d38);border-color:#ff7088}
.btn.sm{padding:8px 14px;font-size:11px}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:rgba(24,160,255,.16);color:var(--blue2);border:1px solid rgba(24,160,255,.4)}
.chip.gold{background:rgba(255,207,64,.15);color:var(--gold);border-color:rgba(255,207,64,.45)}.chip.red{background:rgba(255,68,103,.15);color:#ff8aa0;border-color:rgba(255,68,103,.45)}.chip.grn{background:rgba(52,226,154,.14);color:var(--good);border-color:rgba(52,226,154,.4)}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.screen{position:absolute;inset:0;animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
/* loading */
#loading{position:fixed;inset:0;z-index:50;background:radial-gradient(1200px 700px at 50% 40%,#10202f,#05070a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .8s}
#loading .logo{font-size:min(9vw,84px);line-height:.9;text-align:center}
#loading .logo b{color:var(--blue);display:block;font-size:.42em;letter-spacing:.7em;margin-top:.5em;text-indent:.7em}
.logo span{background:linear-gradient(180deg,#fff,#9fb7d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{width:min(520px,80vw);height:6px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0b78d6,#66d0ff);box-shadow:0 0 14px var(--blue);transition:width .25s}
#loading .msg{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#loading .tip{max-width:540px;text-align:center;color:#a9bbd0;font-size:14px;min-height:40px}
/* main menu */
.menu-left{position:absolute;left:5vw;top:0;bottom:30px;justify-content:center;width:min(380px,86vw);display:flex;flex-direction:column;gap:8px;animation:slideL .6s both}
.menu-logo{margin-bottom:22px}.menu-logo .t{font-size:clamp(34px,6vw,64px);line-height:.88}.menu-logo .s{letter-spacing:.9em;font-size:12px;color:var(--blue2);margin-top:8px;font-weight:700}
.mbtn{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:6px;background:linear-gradient(90deg,rgba(14,18,26,.82),rgba(14,18,26,.35));border-left:3px solid transparent;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px;transition:all .18s;transform-origin:left;backdrop-filter:blur(6px)}
.mbtn:hover,.mbtn.focus{background:linear-gradient(90deg,rgba(24,160,255,.38),rgba(14,18,26,.4));border-left-color:var(--blue2);padding-left:30px;color:#fff}
.mbtn small{font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:none;margin-left:auto;font-size:11px}
.mbtn.main{background:linear-gradient(90deg,#0b78d6,rgba(11,120,214,.2));font-size:18px}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:16px 28px;background:linear-gradient(180deg,rgba(5,7,10,.85),transparent)}
.topbar .grow{flex:1}.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}.stat b{font-size:20px;font-weight:800}.stat small{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.lvl{display:flex;align-items:center;gap:10px}.lvl .badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;background:conic-gradient(var(--blue) calc(var(--p,0)*1%),rgba(255,255,255,.1) 0);position:relative}.lvl .badge::after{content:attr(data-l);position:absolute;inset:4px;background:#0b0f15;border-radius:50%;display:grid;place-items:center}
.pageTitle{font-size:26px;font-weight:900;font-style:italic;letter-spacing:.1em;text-transform:uppercase}
.footer{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:22px;color:var(--dim);font-size:12px;letter-spacing:.08em}
